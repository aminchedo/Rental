name: CI

on:
  push:
    branches: [ main, cleanup/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with ruff (if available)
      run: |
        pip install ruff || true
        ruff check scripts/ || echo "Ruff not available or linting warnings found"
      continue-on-error: true
    
    - name: Smoke test - prepare_data.py help
      run: |
        python scripts/prepare_data.py --help
    
    - name: Smoke test - train.py dry run
      run: |
        python scripts/train.py --dry-run
    
    - name: Smoke test - evaluate.py dry run
      run: |
        python scripts/evaluate.py --dry-run
    
    - name: Integration test - full pipeline
      run: |
        python scripts/prepare_data.py --synthetic 100 --output data/processed
        python scripts/train.py --data data/processed/train.json --out models/checkpoints --epochs 10
        python scripts/evaluate.py --model models/checkpoints/latest.pkl --data data/processed/test.json --report reports/metrics.json
    
    - name: Verify output files
      run: |
        test -f data/processed/train.json || exit 1
        test -f data/processed/test.json || exit 1
        test -f models/checkpoints/latest.pkl || exit 1
        test -f reports/metrics.json || exit 1
        echo "All output files created successfully"
    
    - name: Display results
      run: |
        echo "=== Metrics Report ==="
        cat reports/metrics.json
