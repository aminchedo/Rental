name: CI Pipeline - TypeScript Enforcement

on:
  push:
    branches: [ main, develop, cursor/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Phase P Enforcement: No Python outside archive
  python-check:
    runs-on: ubuntu-latest
    name: "Phase P: Enforce TypeScript-only"
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for Python files outside archive
        run: |
          echo "🔍 Checking for .py files outside archive/python/..."
          if find . -type f -name "*.py" \
             -not -path "./archive/python/*" \
             -not -path "./node_modules/*" \
             -not -path "./.venv/*" \
             -not -path "./venv/*" | grep -q .; then
            echo "❌ CRITICAL: Found .py files outside archive/python/"
            echo "   Backend MUST be TypeScript-only per Phase P specification"
            find . -type f -name "*.py" \
              -not -path "./archive/python/*" \
              -not -path "./node_modules/*" \
              -not -path "./.venv/*" \
              -not -path "./venv/*"
            exit 1
          else
            echo "✅ No Python files outside archive - TypeScript-only enforcement passed"
          fi

  # Backend TypeScript Build
  backend-build:
    runs-on: ubuntu-latest
    needs: python-check
    name: "Backend: TypeScript Build"
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: TypeScript strict type check
        working-directory: backend
        run: npm run lint
      
      - name: Build backend
        working-directory: backend
        run: npm run build
      
      - name: Verify no .js files in backend/src
        run: |
          echo "🔍 Verifying TypeScript-only backend/src..."
          if find backend/src -type f -name "*.js" | grep -q .; then
            echo "❌ CRITICAL: Found .js files in backend/src"
            find backend/src -type f -name "*.js"
            exit 1
          else
            echo "✅ backend/src is TypeScript-only"
          fi

  # Frontend Build
  frontend-build:
    runs-on: ubuntu-latest
    name: "Frontend: Build"
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      
      - name: Build frontend
        working-directory: client
        run: npm run build

  # Dataset Validation (TypeScript)
  dataset-validation:
    runs-on: ubuntu-latest
    needs: python-check
    name: "Step 1: Dataset Validation"
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install ts-node
        run: npm install -g ts-node typescript @types/node
      
      - name: Create datasets (TypeScript)
        run: npx ts-node scripts/download_datasets.ts
      
      - name: Validate datasets (TypeScript)
        run: npx ts-node scripts/check_dataset.ts
      
      - name: Verify checksums exist
        run: |
          if [ ! -f datasets/checksums.txt ]; then
            echo "❌ checksums.txt not found"
            exit 1
          fi
          echo "✅ Checksums verified"

  # API Validation
  api-validation:
    runs-on: ubuntu-latest
    needs: backend-build
    name: "Step 4: API Validation"
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      
      - name: Build backend
        working-directory: backend
        run: npm run build
      
      - name: Validate API script
        run: |
          if [ -f scripts/validate_api.sh ]; then
            echo "✅ API validation script found"
          else
            echo "❌ scripts/validate_api.sh not found"
            exit 1
          fi

  # UI Tests
  ui-tests:
    runs-on: ubuntu-latest
    needs: frontend-build
    name: "Steps 5-7: UI Tests"
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Run UI smoke tests
        run: |
          if [ -f scripts/ui_smoke.test.js ]; then
            node scripts/ui_smoke.test.js
          else
            echo "⚠️  UI smoke test not found, skipping"
          fi

  # Deployment Config Validation
  deployment-validation:
    runs-on: ubuntu-latest
    name: "Step 8: Deployment Config"
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify nginx config
        run: |
          if [ ! -f nginx/nginx.conf ]; then
            echo "❌ nginx/nginx.conf not found"
            exit 1
          fi
          echo "✅ nginx config found"
      
      - name: Verify PM2 config
        run: |
          if [ ! -f pm2/ecosystem.config.js ]; then
            echo "❌ pm2/ecosystem.config.js not found"
            exit 1
          fi
          echo "✅ PM2 config found"

  # Documentation Validation
  docs-validation:
    runs-on: ubuntu-latest
    name: "Final: Documentation"
    steps:
      - uses: actions/checkout@v3
      
      - name: Verify traceability
        run: |
          if [ ! -f docs/traceability.md ]; then
            echo "❌ docs/traceability.md not found"
            exit 1
          fi
          echo "✅ Traceability document found"
      
      - name: Verify report
        run: |
          if [ ! -f report.md ]; then
            echo "❌ report.md not found"
            exit 1
          fi
          echo "✅ Report found"
      
      - name: Verify Python inventory
        run: |
          if [ ! -f docs/python_inventory.md ]; then
            echo "❌ docs/python_inventory.md not found"
            exit 1
          fi
          echo "✅ Python inventory found"

  # Full Acceptance Test
  acceptance:
    runs-on: ubuntu-latest
    needs: [python-check, backend-build, frontend-build, dataset-validation, api-validation, deployment-validation, docs-validation]
    name: "Final: Acceptance Tests"
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install ts-node
        run: npm install -g ts-node typescript @types/node
      
      - name: Run acceptance script
        run: bash scripts/acceptance.sh
      
      - name: Final verification
        run: |
          echo "✅ All CI checks passed"
          echo "✅ TypeScript-only backend enforced"
          echo "✅ Phase P migration complete"
          echo "✅ Ready for deployment"
