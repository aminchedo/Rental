name: CI - Full Implementation Verification

on:
  push:
    branches: [ main, develop, cursor/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # CRITICAL: Enforce TypeScript-only backend
  enforce-typescript-backend:
    name: Enforce TypeScript Backend (No .js files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check for JavaScript files in backend/src
        run: |
          echo "🔍 Checking for .js files in backend/src..."
          if find backend/src -type f -name "*.js" | grep -q .; then
            echo "❌ FAILED: Found .js files in backend/src"
            echo "Backend MUST be TypeScript-only (*.ts files)"
            find backend/src -type f -name "*.js"
            exit 1
          else
            echo "✅ PASSED: No .js files found in backend/src"
            echo "Backend is TypeScript-only as required"
          fi
      
      - name: Verify tsconfig strict mode
        run: |
          echo "🔍 Verifying TypeScript strict mode..."
          if ! grep -q '"strict": true' backend/tsconfig.json; then
            echo "❌ FAILED: strict mode not enabled in backend/tsconfig.json"
            exit 1
          fi
          if ! grep -q '"noImplicitAny": true' backend/tsconfig.json; then
            echo "❌ FAILED: noImplicitAny not enabled in backend/tsconfig.json"
            exit 1
          fi
          echo "✅ PASSED: TypeScript strict mode enabled"

  google-data-ingestion:
    name: Google Data Ingestion (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install -g ts-node typescript @types/node
      
      - name: Run Google data ingestion
        run: npx ts-node scripts/fetch_google_data.ts
      
      - name: Verify outputs
        run: |
          test -f datasets/raw/google_data.jsonl || exit 1
          test -f datasets/combined.jsonl || exit 1
          echo "✅ Google data ingestion complete"

  dataset-validation:
    name: Dataset Validation
    runs-on: ubuntu-latest
    needs: google-data-ingestion
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: pip install -r requirements.txt || echo "No requirements.txt"
      
      - name: Create datasets
        run: python3 scripts/download_datasets.py
      
      - name: Validate datasets
        run: python3 scripts/check_dataset.py
      
      - name: Verify checksums
        run: test -f datasets/checksums.txt || exit 1

  training:
    name: Model Training (CPU)
    runs-on: ubuntu-latest
    needs: dataset-validation
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets
      
      - name: Create datasets
        run: python3 scripts/download_datasets.py
      
      - name: Run training (1 epoch for CI)
        run: |
          python3 scripts/train_cpu.py --epochs 1 --batch_size 2 --lr 5e-5 --max_length 256 --seed 42
      
      - name: Verify model output
        run: |
          test -d models/persian-chat || exit 1
          test -f logs/train.log || exit 1

  evaluation:
    name: Model Evaluation (TypeScript)
    runs-on: ubuntu-latest
    needs: training
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install -g ts-node typescript @types/node
      
      - name: Create test data
        run: python3 scripts/download_datasets.py
      
      - name: Run evaluation
        run: npx ts-node scripts/eval_cpu.ts --data datasets/test.jsonl --model models/persian-chat
      
      - name: Verify evaluation outputs
        run: |
          test -f logs/eval.json || exit 1
          test -f logs/errors.txt || exit 1
          # Check for valid metrics
          if ! grep -q "eval_loss" logs/eval.json; then
            echo "❌ Missing eval_loss in logs/eval.json"
            exit 1
          fi
          if ! grep -q "perplexity" logs/eval.json; then
            echo "❌ Missing perplexity in logs/eval.json"
            exit 1
          fi

  backend-build-and-lint:
    name: Backend Build & Lint (TypeScript)
    runs-on: ubuntu-latest
    needs: enforce-typescript-backend
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: TypeScript lint (strict)
        run: cd backend && npm run lint
      
      - name: Build backend
        run: cd backend && npm run build
      
      - name: Verify build output
        run: |
          test -f backend/dist/server.js || exit 1
          test -f backend/dist/routes/chat.js || exit 1

  backend-api-tests:
    name: Backend API Validation
    runs-on: ubuntu-latest
    needs: backend-build-and-lint
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install backend dependencies
        run: cd backend && npm ci
      
      - name: Start backend server
        run: |
          cd backend && npm run build && npm start &
          sleep 5
      
      - name: Run API validation tests
        run: bash scripts/validate_api.sh

  frontend-build-and-test:
    name: Frontend Build & UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Determine frontend directory
        id: frontend
        run: |
          if [ -d "frontend" ]; then
            echo "dir=frontend" >> $GITHUB_OUTPUT
          elif [ -d "client" ]; then
            echo "dir=client" >> $GITHUB_OUTPUT
          else
            echo "❌ No frontend directory found"
            exit 1
          fi
      
      - name: Install frontend dependencies
        run: cd ${{ steps.frontend.outputs.dir }} && npm ci
      
      - name: Build frontend
        run: cd ${{ steps.frontend.outputs.dir }} && npm run build
      
      - name: Run UI smoke tests
        run: FRONTEND_DIR=${{ steps.frontend.outputs.dir }} node scripts/ui_smoke.test.js

  deployment-artifacts:
    name: Verify Deployment Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check nginx config
        run: |
          test -f nginx/nginx.conf || exit 1
          grep -q "proxy_pass\|/api/" nginx/nginx.conf || exit 1
      
      - name: Check PM2 config
        run: |
          test -f pm2/ecosystem.config.js || exit 1
          grep -q "apps" pm2/ecosystem.config.js || exit 1

  documentation:
    name: Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check traceability matrix
        run: |
          test -f docs/traceability.md || exit 1
          test -s docs/traceability.md || exit 1
      
      - name: Check report
        run: |
          test -f report.md || exit 1

  acceptance-gate:
    name: Final Acceptance Gate
    runs-on: ubuntu-latest
    needs: 
      - enforce-typescript-backend
      - google-data-ingestion
      - dataset-validation
      - training
      - evaluation
      - backend-build-and-lint
      - backend-api-tests
      - frontend-build-and-test
      - deployment-artifacts
      - documentation
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python & Node
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install all dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers datasets
          npm install -g ts-node typescript @types/node
      
      - name: Run acceptance script
        run: bash scripts/acceptance.sh
      
      - name: Verify all checks passed
        run: echo "✅ All acceptance criteria met!"
